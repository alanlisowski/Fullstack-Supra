{% extends "contacts/base.html" %}

{% block content %}
<h1 class="h3 mb-3">Delete contact</h1>

<div class="col-md-6 col-lg-4">
    <p>Delete <strong>{{ object.full_name }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'contact-list' %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
